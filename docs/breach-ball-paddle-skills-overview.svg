<svg width="680" height="510" viewBox="0 0 680 510" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Breach Ball paddle skill overview</title>
<desc>Functional mockups of the base paddle and its skill variants: grow at three tiers, laser at three tiers, magnetic pull at three tiers arranged horizontally, and sticky catch across four states: ball approaching, level 1 resting catch, level 2 with a release-direction line from the ball's center, and level 3 which extends that line through one bounce to the next wall or brick.</desc>
